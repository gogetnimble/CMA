image: mcr.microsoft.com/dotnet/sdk:10.0

pipelines:
  branches:
    "feature/CTCS-539-Cma-Crm-Service-Repository-Setup":
      - step:
          name: Build & Publish Function App (.NET 10)
          caches:
            - dotnetcore
          script:
            # 1. Restore dependencies
            - dotnet restore Services/Cma.Azure.Services/Cma.App.Http/Cma.App.Http.csproj

            # 2. Build project
           - dotnet build Services/Cma.Azure.Services/Cma.App.Http/Cma.App.Http.csproj --configuration Release --no-restore

            # 3. Publish project
           - dotnet publish Services/Cma.Azure.Services/Cma.App.Http/Cma.App.Http.csproj --configuration Release --output published

            # 4. Zip published output
            - cd published
            - zip -r ../functionapp.zip .
            - cd ..

          artifacts:
            - functionapp.zip

      - step:
          name: Deploy to Azure Function App (Dev)
          image: mcr.microsoft.com/azure-cli:latest
          script:
            # 1. Authenticate to Azure
            - echo "$AZURE_CREDENTIALS" > azure.json
            - az login --service-principal \
                --username $(jq -r .clientId azure.json) \
                --password $(jq -r .clientSecret azure.json) \
                --tenant $(jq -r .tenantId azure.json)

            # 2. Select subscription
            - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

            # 3. Deploy ZIP to Azure Function App
            - az functionapp deployment source config-zip \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_FUNCTIONAPP_NAME" \
                --src functionapp.zip